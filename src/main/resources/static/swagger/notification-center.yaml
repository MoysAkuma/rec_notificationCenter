openapi: 3.0.3
info:
  title: Notification Center Reception API
  version: 1.0.0
  description: Contrato Swagger/OpenAPI para la capa de recepcion construida con Apache Camel.
servers:
  - url: http://localhost:8080/api
paths:
  /notifications:
    post:
      summary: Recibe una notificacion
      operationId: receiveNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '202':
          description: Notificacion aceptada para procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
components:
  schemas:
    NotificationRequest:
      type: object
      required:
        - recipient
        - channel
        - message
      properties:
        recipient:
          type: string
          example: user@example.com
        channel:
          type: string
          example: EMAIL
        message:
          type: string
          example: Hola desde Notification Center
    NotificationResponse:
      type: object
      required:
        - notificationId
        - status
      properties:
        notificationId:
          type: string
          format: uuid
        status:
          type: string
          example: RECEIVED
